let selectedClass="All";

/* =====================================================
   FILTERS
===================================================== */

const filters =
 document.getElementById("filters");


function makeFilters(){

 filters.innerHTML="";

 addFilter(
  "All",
  "All Classes"
 );

 for(let i=1;i<=5;i++){

  addFilter(
   "Class "+i,
   "Class "+i
  );

 }

 const subjects=[
  "Hindi",
  "English",
  "Mathematics",
  "Science",
  "GK"
 ];

 subjects.forEach(subject=>{

  addFilter(
   "Subject:"+subject,
   subject
  );

 });

}


function addFilter(value,text){

 const button =
  document.createElement("button");

 button.className="filter";

 if(value==="All"){
  button.classList.add("active");
 }

 button.textContent=text;

 button.onclick=()=>{

  document
   .querySelectorAll(".filter")
   .forEach(
    x=>x.classList.remove("active")
   );

  button.classList.add("active");

  if(value==="All"){

   selectedClass="All";
   selectedSubject="All";

  }

  else if(
   value.startsWith("Class")
  ){

   selectedClass =
    value.split(" ")[1];

   selectedSubject="All";

  }

  else{

   selectedClass="All";

   selectedSubject =
    value.split(":")[1];

  }

  renderBooks();

 };

 filters.appendChild(button);

}


/* =====================================================
   BOOK DISPLAY
===================================================== */

function renderBooks(){

 const search =
  document
   .getElementById("search")
   .value
   .toLowerCase();

 const box =
  document.getElementById("books");


 const list =
  BOOKS.filter(book=>{

   const classOK =
    selectedClass==="All" ||
    String(book.class)===selectedClass;

   const subjectOK =
    selectedSubject==="All" ||
    book.subject===selectedSubject;

   const searchOK =
    book.title
     .toLowerCase()
     .includes(search) ||

    book.subject
     .toLowerCase()
     .includes(search);

   return classOK &&
          subjectOK &&
          searchOK;

  });


 box.innerHTML="";


 list.forEach(book=>{

  const card =
   document.createElement("article");

  card.className="book";

  card.innerHTML=`

   <div class="bookIcon">
    ${book.icon}
   </div>

   <div class="bookClass">
    CLASS ${book.class}
   </div>

   <h3>
    ${book.title}
   </h3>

   <p>
    ${book.chapters.length}
    Chapters • Lessons • Quiz
   </p>

   <span class="tag">
    ${book.subject}
   </span>

  `;

  card.onclick =
   ()=>openBook(book.id);

  box.appendChild(card);

 });


 if(!list.length){

  box.innerHTML=`

   <div style="
    background:white;
    padding:30px;
    border-radius:18px;
    text-align:center;
    grid-column:1/-1;
   ">
    कोई book नहीं मिली।
   </div>

  `;

 }

}


/* =====================================================
   OPEN BOOK
===================================================== */

function openBook(id){

  BOOKS.find(
   book=>book.id===id
  );

 currentChapter=0;
 currentPage=0;

 document
  .getElementById("readerTitle")
  .textContent =
   currentBook.icon+
   " "+
   currentBook.title;

 document
  .getElementById("readerModal")
  .classList.add("show");

 renderChapters();

 renderPage();

}


/* =====================================================
   CHAPTERS
===================================================== */

function renderChapters(){

 const box =
  document.getElementById(
   "chapterList"
  );

 box.innerHTML="";


 currentBook.chapters.forEach(
  (chapter,index)=>{

   const button =
    document.createElement("button");

   button.className =
    "chapter "+
    (
     index===currentChapter
      ? "active"
      : ""
    );

   button.innerHTML=`

    📖 ${chapter.title}

    <br>

    <small>
     ${chapter.pages.length} pages
    </small>

   `;

   button.onclick=()=>{

    currentChapter=index;
    currentPage=0;

    renderChapters();
    renderPage();

   };

   box.appendChild(button);

  }
 );

}


/* =====================================================
   PAGE
===================================================== */

function renderPage(){

 const chapter =
  currentBook
   .chapters[currentChapter];

 const page =
  document.getElementById(
   "bookPage"
  );


 if(chapter.pages.length===0){

  page.innerHTML=`

   <div class="emptyPage">

    <div>

     <div style="font-size:55px">
      📚
     </div>

     <h2>
      ${chapter.title}
     </h2>

     <p style="margin-top:10px">
      इस chapter के authorized
      book pages अभी add नहीं किए गए हैं।
     </p>

    </div>

   </div>

  `;

 }

 else{

  page.innerHTML=`

   <img
    src="${chapter.pages[currentPage]}"
    alt="Book page"
   >

   <p style="
    text-align:center;
    margin-top:10px;
    color:#667085;
   ">
    Page ${currentPage+1}
    /
    ${chapter.pages.length}
   </p>

  `;

 }


 const percent =
  chapter.pages.length
   ? (
      (currentPage+1) /
      chapter.pages.length
     ) * 100
   : 0;


 document
  .getElementById("progressBar")
  .style.width =
   percent+"%";


 renderQuiz();

}


/* =====================================================
   PAGE CONTROLS
===================================================== */

function nextPage(){

 if(!currentBook) return;

 const pages =
  currentBook
   .chapters[currentChapter]
   .pages;

 if(
  currentPage <
  pages.length-1
 ){

  currentPage++;

  renderPage();

 }

}


function previousPage(){

 if(currentPage>0){

  currentPage--;

  renderPage();

 }

}

/* =====================================================
   QUIZ
===================================================== */

function renderQuiz(){

 const box =
  document.getElementById("quiz");

 const questions =
  currentBook
   .chapters[currentChapter]
   .quiz;


 if(!questions.length){

  box.innerHTML="";

  return;

 }

 box.innerHTML="";


 questions.forEach(
  (question,qIndex)=>{

   const div =
    document.createElement("div");

   div.className="quiz";

   div.innerHTML=`

    <h3>
     📝 Quick Quiz
    </h3>

    <p style="margin-top:10px">
     ${qIndex+1}.
     ${question.question}
    </p>

   `;


   question.options.forEach(
    (option,oIndex)=>{

     const btn =
      document.createElement("button");

     btn.className="option";

     btn.textContent=option;

     btn.onclick=()=>{

      if(
       oIndex===
       question.answer
      ){

       btn.style.borderColor =
        "#22c55e";

       btn.style.background =
        "#dcfce7";

       speak(
        "सही जवाब! बहुत बढ़िया।"
       );

      }

      else{

       btn.style.borderColor =
        "#ef4444";

       btn.style.background =
        "#fee2e2";

       speak(
        "यह जवाब सही नहीं है।"
       );

      }

     };

     div.appendChild(btn);

    }
   );

   box.appendChild(div);

  }
 );

}

 div.textContent=text;

 chat.appendChild(div);

/* =====================================================
   ONLINE GEMINI AI
===================================================== */

async function askTeacher(){

 const input =
  document.getElementById(
   "question"
  );

 const question =
  input.value.trim();


 if(!question){

  speak(
   "कृपया अपना सवाल लिखिए।"
  );

  return;

 }


 addMessage(
  question,
  "user"
 );

 input.value="";


 const loading =
  document.createElement("div");

 loading.className =
  "message ai";

 loading.textContent =
  "🤖 Samsela Teacher सोच रही है...";

 document
  .getElementById("chat")
  .appendChild(loading);


 try{

  let bookName =
   currentBook
    ? currentBook.title
    : "कोई book selected नहीं";

  let subject =
   currentBook
    ? currentBook.subject
    : "General";

  let chapter =
   currentBook
    ? currentBook
       .chapters[currentChapter]
       .title
    : "General";


  const prompt = `

आप Samsela के Online AI Teacher हैं।

विद्यार्थी:
Class: ${
  currentBook
   ? currentBook.class
   : "Unknown"
}

Book:
${bookName}

Subject:
${subject}

Chapter:
${chapter}

विद्यार्थी का सवाल:
${question}

आपका काम:

1. सही उत्तर दें।
2. उत्तर आसान हिंदी में दें।
3. अगर विद्यार्थी English सीख रहा है तो English example भी दें।
4. Maths में calculation step-by-step करें।
5. Science में आसान उदाहरण दें।
6. छोटे बच्चे के स्तर की भाषा रखें।
7. अगर सवाल स्पष्ट नहीं है तो clarification माँगें।
8. जानकारी न हो तो गलत उत्तर न बनाएं।
9. उत्तर बहुत लंबा न करें।
10. जरूरत होने पर अंत में छोटा example दें।

`;


  const result =
   await model.generateContent(
    prompt
   );


  const response =
   result.response;


  const answer =
   response.text();


  loading.remove();


  lastAnswer =
   answer;


  addMessage(
   answer,
   "ai"
  );


  speak(answer);


 }

 catch(error){

  console.error(
   "Firebase AI Error:",
   error
  );


  loading.remove();


  let message =
   "❌ AI Teacher से जवाब नहीं मिल पाया।";


  if(
   error &&
   error.message
  ){

   if(
    error.message
     .toLowerCase()
     .includes("app check")
   ){

    message =
     "❌ Firebase App Check की समस्या है। Firebase Console में Samsela Web App का App Check setup पूरा करना होगा।";

   }

   else if(
    error.message
     .toLowerCase()
     .includes("quota")
   ){

    message =
     "❌ AI usage limit पूरी हो गई है। थोड़ी देर बाद फिर कोशिश करें।";

   }

   else{

    message =
     "❌ AI connection में समस्या आई। Internet और Firebase setup check करें।";

   }

  }


  addMessage(
   message,
   "ai"
  );

 }

}

/* =====================================================
   VOICE OUTPUT
===================================================== */

function speak(text){

 if(
  !("speechSynthesis" in window)
 ){

  alert(
   "इस browser में Voice उपलब्ध नहीं है।"
  );

  return;

 }


 speechSynthesis.cancel();


 const utterance =
  new SpeechSynthesisUtterance(
   text
  );


 utterance.lang =
  "hi-IN";

 utterance.rate =
  0.9;

 utterance.pitch =
  1.05;


 const voices =
  speechSynthesis.getVoices();


 const hindiVoice =
  voices.find(
   voice=>
    voice.lang
     .toLowerCase()
     .startsWith("hi")
  );


 if(hindiVoice){

  utterance.voice =
   hindiVoice;

 }


 speechSynthesis.speak(
  utterance
 );

}


function speakLast(){

 if(lastAnswer){

  speak(lastAnswer);

 }

}


function stopVoice(){

 if(
  "speechSynthesis" in window
 ){

  speechSynthesis.cancel();

 }

}


/* =====================================================
   VOICE INPUT
===================================================== */

function startVoice(){

 const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


 if(!SpeechRecognition){

  alert(
   "आपके browser में Voice Input उपलब्ध नहीं है। Android Chrome में खोलें।"
  );

  return;

 }


 const recognition =
  new SpeechRecognition();


 recognition.lang =
  "hi-IN";

 recognition.interimResults =
  false;

 recognition.continuous =
  false;


 addMessage(
  "🎙️ सुन रही हूँ... बोलिए।",
  "ai"
 );


 recognition.onresult =
  event=>{

   const text =
    event
     .results[0][0]
     .transcript;


   document
    .getElementById(
     "question"
    )
    .value =
     text;


   askTeacher();

  };


 recognition.onerror =
  ()=>{
   
   addMessage(
    "🎙️ आवाज़ साफ़ नहीं मिली। फिर से बोलिए।",
    "ai"
   );

  };


 recognition.start();

}
